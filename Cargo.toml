[package]
name = "oixc-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Named-node SOCKS5 gateway for OIX Cloud managed Snell ECH nodes"
license = "MIT"

[features]
default = []
benchmark = []

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
aes-gcm = "0.10.3"
anyhow = "1.0.100"
argon2 = "0.5.3"
base64 = "0.22.1"
bytes = "1.10.1"
data-encoding = "2.9.0"
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hex = "0.4.3"
hmac = "0.12.1"
hickory-proto = "0.25.2"
http = "1.3.1"
libc = "0.2.177"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23.35", default-features = true }
rustls-native-certs = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-rustls = "0.26.4"
url = "2.5.7"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1

[[example]]
name = "snell-bench-server"
path = "examples/snell_bench_server.rs"

[[example]]
name = "snell-bench-client"
path = "examples/snell_bench_client.rs"
required-features = ["benchmark"]
