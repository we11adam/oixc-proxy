name: Vendored rustls

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  upstream:
    name: Check upstream rustls
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      # cargo-audit cannot see a path dependency, so watch upstream releases directly.
      - name: Verify vendored tree
        shell: bash
        run: scripts/vendor-rustls.sh check

      - name: Fail when a newer rustls 0.23.x is published
        shell: bash
        run: scripts/vendor-rustls.sh outdated
